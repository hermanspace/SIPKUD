# SIPKUD - Development Docker Compose (self-contained)
#
# Seluruh dependensi berjalan sebagai container - tidak perlu install
# PHP/Composer/Node/PostgreSQL/Redis di host. Cukup Docker + make.
#
#   make setup   # pertama kali: build, up, composer install, migrate, assets
#   make up      # jalankan stack
#   make down    # hentikan stack
#
# Lihat Makefile untuk daftar perintah lengkap.

name: sipkud-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
    image: sipkud-app:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      # Kode di-bind-mount agar perubahan langsung terlihat (hot reload PHP)
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:${APP_PORT:-8000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sipkud}
      - DB_USERNAME=${DB_USERNAME:-sipkud}
      - DB_PASSWORD=${DB_PASSWORD:-sipkud}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    image: sipkud-app:dev
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sipkud}
      - DB_USERNAME=${DB_USERNAME:-sipkud}
      - DB_PASSWORD=${DB_PASSWORD:-sipkud}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started

  scheduler:
    image: sipkud-app:dev
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sipkud}
      - DB_USERNAME=${DB_USERNAME:-sipkud}
      - DB_PASSWORD=${DB_PASSWORD:-sipkud}
      - REDIS_HOST=redis
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Ekspos ke host untuk akses via GUI (DBeaver/TablePlus dsb.)
      # Default 54320 agar tidak bentrok dengan PostgreSQL lokal di 5432;
      # override lewat .env: DB_HOST_PORT=5432
      - "${DB_HOST_PORT:-54320}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sipkud}
      POSTGRES_USER: ${DB_USERNAME:-sipkud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sipkud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sipkud} -d ${DB_DATABASE:-sipkud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mail catcher: semua email dev tertangkap di UI http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Node untuk perintah npm on-demand (make npm-build / npm-install):
  #   docker compose -f docker-compose.dev.yml run --rm node npm run build
  node:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

  # Vite dev server (HMR) - opsional: make npm-dev
  vite:
    image: node:20-alpine
    profiles: ["vite"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

volumes:
  pgdata:
  redisdata:
