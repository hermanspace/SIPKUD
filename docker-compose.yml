# SIPKUD Laravel - Production Docker Compose
#
# Dua mode pemakaian (lihat Makefile: make prod-up / prod-up-bundled):
#
# 1. Infra bersama (default): PostgreSQL & Redis sudah ada di server sebagai
#    container `postgres-db` dan `redis-cache` pada network `backend`.
#      docker compose up -d
#
# 2. Mandiri (bundled): server kosong tanpa infra bersama - profil "bundled"
#    menyalakan PostgreSQL & Redis dari compose ini juga.
#      docker compose --profile bundled up -d
#
# Network frontend/backend bersifat external; buat sekali dengan:
#      make prod-init   (atau: docker network create frontend && docker network create backend)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH}
    image: sipkud-app:latest
    container_name: sipkud-app
    restart: unless-stopped
    expose:
      - "80"
    volumes:
     
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    env_file:
      - .env
    networks:
      - frontend
      - backend
    healthcheck:
      # /up = health endpoint ringan Laravel (tanpa render halaman penuh)
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue:
    image: sipkud-app:latest
    container_name: sipkud-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
    
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
      - QUEUE_CONNECTION=redis
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      - app
    # Override healthcheck image (curl /up): container ini tidak menjalankan
    # Apache, jadi cek proses worker (PID 1) sebagai gantinya.
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'queue:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: sipkud-app:latest
    container_name: sipkud-scheduler
    restart: unless-stopped
    # schedule:work = long-running scheduler resmi Laravel (tanpa overlap).
    # Tidak me-mount kode host: semua kontainer memakai kode dari image yang sama.
    command: php artisan schedule:work
    volumes:
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'schedule:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------
  # Profil "bundled": PostgreSQL & Redis untuk deployment mandiri
  # (server tanpa infra bersama). Nama container sengaja disamakan dengan
  # infra bersama (postgres-db / redis-cache) agar DB_HOST/REDIS_HOST sama.
  # ---------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    profiles: ["bundled"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE di .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di .env}
    volumes:
      - sipkud-pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    profiles: ["bundled"]
    restart: unless-stopped
    volumes:
      - sipkud-redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sipkud-storage:
  sipkud-pgdata:
  sipkud-redisdata:

# COMPOSER_AUTH di .env untuk build (Flux Pro)
# Format: COMPOSER_AUTH='{"http-basic":{"composer.fluxui.dev":{"username":"EMAIL","password":"TOKEN"}}}'

networks:
  frontend:
    external: true
  backend:
    external: true
