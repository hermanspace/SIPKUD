# SIPKUD Laravel - Production Docker Compose
# - Database & Redis: handled by server infrastructure (postgres-db, redis-cache)
# - Networks: frontend (NPM), backend (postgres, redis)
# - Tidak ada service database di sini; connect ke existing postgres-db

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH}
    image: sipkud-app:latest
    container_name: sipkud-app
    restart: unless-stopped
    expose:
      - "80"
    volumes:
     
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    env_file:
      - .env
    networks:
      - frontend
      - backend
    healthcheck:
      # /up = health endpoint ringan Laravel (tanpa render halaman penuh)
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue:
    image: sipkud-app:latest
    container_name: sipkud-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
    
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
      - QUEUE_CONNECTION=redis
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      - app

  scheduler:
    image: sipkud-app:latest
    container_name: sipkud-scheduler
    restart: unless-stopped
    # schedule:work = long-running scheduler resmi Laravel (tanpa overlap).
    # Tidak me-mount kode host: semua kontainer memakai kode dari image yang sama.
    command: php artisan schedule:work
    volumes:
      - sipkud-storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - REDIS_HOST=redis-cache
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      - app

volumes:
  sipkud-storage:

# COMPOSER_AUTH di .env untuk build (Flux Pro)
# Format: COMPOSER_AUTH='{"http-basic":{"composer.fluxui.dev":{"username":"EMAIL","password":"TOKEN"}}}'

networks:
  frontend:
    external: true
  backend:
    external: true
