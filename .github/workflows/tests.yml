name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing

    # Test dijalankan terhadap PostgreSQL (paritas dengan produksi),
    # bukan SQLite bawaan phpunit.xml. Variabel env di bawah menimpa
    # nilai <env> phpunit.xml karena force=false.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sipkud_test
          POSTGRES_USER: sipkud
          POSTGRES_PASSWORD: sipkud_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sipkud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: sipkud_test
      DB_USERNAME: sipkud
      DB_PASSWORD: sipkud_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Samakan dengan produksi (Dockerfile: php:8.3-apache)
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, gd, zip
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest
